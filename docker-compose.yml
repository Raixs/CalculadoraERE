services:
  app:
    build:
      context: .
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev -- --host 0.0.0.0"

  unit:
    build:
      context: .
    profiles: ['tests']
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run test"

  e2e:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    profiles: ['tests']
    working_dir: /app
    volumes:
      - .:/app
      - playwright_node_modules:/app/node_modules
      - playwright_cache:/ms-playwright
    command: sh -lc "npm ci && npx playwright install --with-deps chromium && npm run test:e2e"

volumes:
  app_node_modules:
  playwright_node_modules:
  playwright_cache:
